# Workflow intended to run CNI plugin static QA and tests on GitHub-hosted Windows runners.

name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  GO_VERSION: 1.23

permissions:
  contents: read

jobs:
  checks:
    name: Run Checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v1.62.2
          skip-cache: true
          args: --timeout=8m

      - name: Install runhcs
        shell: bash
        run: |
          HCSSHIM_VER=$(sed -E -n "s|\t*github.com/Microsoft/hcsshim (.*)|\1|p" go.mod)
          git clone https://github.com/Microsoft/hcsshim -b "$HCSSHIM_VER" /tmp/hcsshim
          cd /tmp/hcsshim
          go install ./...

      - name: Enable ICMP V4
        shell: pwsh
        run: |
          netsh advFirewall Firewall add rule name="Enable ICMP Protocal" protocol=icmpv4:8,any dir=in action=allow

      - name: Log Runner Interfaces
        shell: pwsh
        run: Get-NetIPAddress

      - name: Test
        env:
          ImageToUse: mcr.microsoft.com/windows/nanoserver:ltsc2022
        run: |
          mingw32-make.exe test
